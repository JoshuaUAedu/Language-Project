<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Transcription & Translation - Journal</title>
    <link rel="stylesheet" href="journal.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Top Bar -->
    <header class="top-bar">
        <div class="top-bar-left">
            <a href="index.html" class="home-btn" aria-label="Home">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>Home</span>
            </a>
        </div>
        <h1 class="app-title">Language Transcription &amp; Translation <span class="app-badge">LDT3</span></h1>
        <div class="top-bar-right">
            <button class="icon-btn" id="profile-btn" aria-label="Profile">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </button>
            <button class="icon-btn" id="settings-btn" aria-label="Settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M12 1v6m0 6v6M5.64 5.64l4.24 4.24m4.24 4.24l4.24 4.24M1 12h6m6 0h6M5.64 18.36l4.24-4.24m4.24-4.24l4.24-4.24"></path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="main-container">
        <!-- Central Notebook -->
        <div class="notebook-section">
            <!-- Listening for transcription (above journal) -->
            <div class="listening-indicator" id="listening-indicator">
                <button class="mic-toggle-btn" id="mic-toggle-btn" aria-label="Toggle microphone">
                    <svg class="mic-icon" id="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                    <svg class="mic-muted-icon" id="mic-muted-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                        <path d="M1 1l22 22"></path>
                        <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path>
                        <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </button>
                <div class="waveform" id="waveform">
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                </div>
                <span class="listening-text" id="listening-text">Listening for transcription...</span>
                <button class="lang-script-btn" id="lang-script-btn" aria-label="Toggle script: Latin">
                    <span class="lang-script-abc" id="lang-script-abc">abc</span>
                    <span class="lang-script-char" id="lang-script-char" style="display: none;">文</span>
                </button>
            </div>
            <div class="notebook">
                <!-- Shared journal title (changeable, applies to both sides) -->
                <div class="journal-title-wrap">
                    <div class="transcribe-btn-wrap">
                        <button type="button" class="transcribe-btn" id="transcribe-btn">Transcribe</button>
                        <div class="transcribe-indicator" id="transcribe-indicator" aria-label="Transcription status">
                            <div class="title-wave-bar"></div>
                            <div class="title-wave-bar"></div>
                            <div class="title-wave-bar"></div>
                            <div class="title-wave-bar"></div>
                            <div class="title-wave-bar"></div>
                        </div>
                    </div>
                    <div class="journal-title-center">
                        <h2 class="journal-title" contenteditable="true" id="journal-title" data-placeholder="Journal">Journal</h2>
                    </div>
                    <button type="button" class="study-btn" id="study-btn">Study</button>
                </div>
                <div class="notebook-spread" id="notebook-spread">
                    <!-- Left Page -->
                    <div class="page left-page">
                        <div class="page-content">
                            <div class="language-select-wrap">
                                <button type="button" class="language-btn" id="language-left-btn" aria-haspopup="listbox" aria-expanded="false">
                                    <span class="language-btn-label" id="language-left-label">English</span>
                                    <svg class="language-btn-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="6 9 12 15 18 9"></polyline>
                                    </svg>
                                </button>
                                <div class="language-dropdown" id="language-left-dropdown" role="listbox" aria-hidden="true"></div>
                            </div>
                            <div class="page-text" contenteditable="true" id="english-text" data-placeholder="Waiting for transcription... Type or dictate here."></div>
                        </div>
                    </div>

                    <!-- Binding -->
                    <div class="binding">
                        <button type="button" class="swap-lang-btn" id="swap-lang-btn" aria-label="Swap languages" title="Swap languages">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                <path d="M7 16V4m0 0L3 8m4-4l4 4"></path>
                                <path d="M17 8v12m0 0l4-4m-4 4l-4-4"></path>
                            </svg>
                        </button>
                        <div class="binding-stitch"></div>
                        <div class="binding-stitch"></div>
                        <div class="binding-stitch"></div>
                        <div class="binding-stitch"></div>
                    </div>

                    <!-- Right Page -->
                    <div class="page right-page">
                        <div class="page-content">
                            <div class="language-select-wrap">
                                <button type="button" class="confidence-toggle-btn" id="confidence-toggle-btn" aria-label="Toggle confidence scores" title="Show/hide translation confidence">%</button>
                                <button type="button" class="language-btn" id="language-right-btn" aria-haspopup="listbox" aria-expanded="false">
                                    <span class="language-btn-label" id="language-right-label">Spanish</span>
                                    <svg class="language-btn-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="6 9 12 15 18 9"></polyline>
                                    </svg>
                                </button>
                                <div class="language-dropdown" id="language-right-dropdown" role="listbox" aria-hidden="true"></div>
                            </div>
                            <div class="page-text" contenteditable="false" id="spanish-text" data-placeholder="Traducción pendiente... Escriba o dicte aquí."></div>
                        </div>
                    </div>
                </div>
                <!-- Journal page navigation -->
                <div class="journal-page-nav" id="journal-page-nav">
                    <button type="button" class="study-page-nav-btn" id="prev-page-btn" disabled>&#8592; Prev</button>
                    <span class="study-page-indicator" id="binding-page-indicator">Page 1 of 1</span>
                    <button type="button" class="delete-page-btn" id="delete-page-btn" aria-label="Delete current page" title="Delete this page">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                            <path d="M10 11v6"></path>
                            <path d="M14 11v6"></path>
                            <path d="M9 6V4h6v2"></path>
                        </svg>
                    </button>
                    <button type="button" class="study-page-nav-btn" id="next-page-btn" disabled>Next &#8594;</button>
                </div>
                <!-- Study mode: single centered page with flip -->
                <div class="study-mode-view" id="study-mode-view" aria-hidden="true">
                    <div class="study-mode-inner">
                        <div class="study-card" id="study-card">
                            <div class="study-card-inner" id="study-card-inner">
                                <div class="study-face study-face-source" id="study-face-source">
                                    <div class="study-face-label" id="study-source-label">English</div>
                                    <div class="study-face-text" id="study-source-text"></div>
                                    <div class="study-hint-text" id="study-hint-text"></div>
                                </div>
                                <div class="study-face study-face-target" id="study-face-target">
                                    <div class="study-face-label" id="study-target-label">Spanish</div>
                                    <div class="study-face-text" id="study-target-text"></div>
                                </div>
                            </div>
                        </div>
                        <div class="study-controls">
                            <button type="button" class="study-score-btn missed-btn" id="missed-btn">
                                Missed <span class="score-badge" id="missed-count">0</span>
                            </button>
                            <div class="study-center-controls">
                                <button type="button" class="speak-btn" id="speak-btn" aria-label="Say the target text aloud" title="Say the target text aloud to check pronunciation">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                                        <line x1="12" y1="19" x2="12" y2="23"></line>
                                        <line x1="8" y1="23" x2="16" y2="23"></line>
                                    </svg>
                                    <span id="speak-btn-text">Speak</span>
                                </button>
                                <div class="speak-result" id="speak-result"></div>
                                <button type="button" class="hint-toggle-btn" id="hint-toggle-btn">Hint</button>
                                <button type="button" class="flip-page-btn" id="flip-page-btn">
                                    <span id="flip-page-btn-text">Show translation</span>
                                </button>
                            </div>
                            <button type="button" class="study-score-btn correct-btn" id="correct-btn">
                                Correct <span class="score-badge" id="correct-count">0</span>
                            </button>
                        </div>
                        <div class="study-page-nav">
                            <button type="button" class="study-page-nav-btn" id="study-prev-page-btn" disabled>&#8592; Prev</button>
                            <span class="study-page-indicator" id="study-page-indicator">Page 1 of 1</span>
                            <button type="button" class="study-page-nav-btn" id="study-next-page-btn" disabled>Next &#8594;</button>
                        </div>
                        <button type="button" class="exam-start-btn" id="exam-start-btn">&#127891; Exam</button>

                        <!-- ── Exam overlay ─────────────────────────────── -->
                        <div class="exam-overlay" id="exam-overlay" aria-hidden="true">

                            <!-- Question screen -->
                            <div class="exam-question-screen" id="exam-question-screen">
                                <div class="exam-top-bar">
                                    <span class="exam-progress-text" id="exam-progress-text">Question 1 of 1</span>
                                    <span class="exam-retry-chip" id="exam-retry-chip" hidden>2nd Chance</span>
                                </div>
                                <div class="exam-question-card" id="exam-question-card">
                                    <div class="exam-qtype" id="exam-qtype"></div>
                                    <div class="exam-prompt-text" id="exam-prompt-text"></div>
                                </div>
                                <div class="exam-input-area">
                                    <!-- Speak input -->
                                    <div class="exam-speak-wrap" id="exam-speak-wrap">
                                        <button type="button" class="speak-btn" id="exam-mic-btn">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                                                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                                                <line x1="12" y1="19" x2="12" y2="23"></line>
                                                <line x1="8" y1="23" x2="16" y2="23"></line>
                                            </svg>
                                            <span id="exam-mic-label">Speak</span>
                                        </button>
                                        <div class="speak-result" id="exam-speak-feedback"></div>
                                    </div>
                                    <!-- Type input -->
                                    <div class="exam-type-wrap" id="exam-type-wrap">
                                        <input type="text" class="exam-type-input" id="exam-type-input"
                                               placeholder="Type your answer…" autocomplete="off" />
                                    </div>
                                </div>
                                <div class="exam-feedback-row" id="exam-feedback-row">
                                    <span class="exam-feedback-icon" id="exam-feedback-icon"></span>
                                    <span class="exam-feedback-msg"  id="exam-feedback-msg"></span>
                                    <div  class="exam-correct-ans"   id="exam-correct-ans"></div>
                                </div>
                                <div class="exam-btn-row">
                                    <button type="button" class="exam-submit-btn" id="exam-submit-btn">Submit</button>
                                    <button type="button" class="exam-next-btn"   id="exam-next-btn" hidden>Next &#8594;</button>
                                </div>
                            </div>

                            <!-- Results screen -->
                            <div class="exam-results-screen" id="exam-results-screen" hidden>
                                <div class="exam-result-trophy">&#127942;</div>
                                <div class="exam-result-score" id="exam-result-score"></div>
                                <div class="exam-result-verdict" id="exam-result-verdict"></div>
                                <div class="exam-result-level"   id="exam-result-level"></div>
                                <button type="button" class="exam-exit-btn" id="exam-exit-btn">Exit Exam</button>
                            </div>

                        </div><!-- /exam-overlay -->
                    </div>
                </div>
            </div>

            <!-- Save Journal Button -->
            <div class="save-button-container">
                <button class="save-journal-btn" id="save-journal-btn">
                    <svg class="save-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
                        <polyline points="7 3 7 8 15 8"></polyline>
                    </svg>
                    <span>Save Journal</span>
                </button>
            </div>
        </div>

        <!-- Right Sidebar - Saved Journals -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2 class="sidebar-title">Saved Journals</h2>
                <button type="button" class="new-journal-btn" id="new-journal-btn" aria-label="New journal">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>
            <div class="journal-list" id="journal-list"></div>
        </aside>
    </div>

    <script src="config.js"></script>
    <script src="journal.js"></script>
</body>
</html>
